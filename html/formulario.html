<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/formulario.css">
<link rel="stylesheet" href="../css/header.css">

<title>Solicite seu orçamento</title>
</head>

<body>

<div class="topo">
<h1>Solicite seu <span>orçamento</span></h1>
<p>Preencha o formulário abaixo para nossa equipe entrar em contato.</p>
</div>

<div class="boxFormulario">

<div class="barra">
<div class="progresso" id="barraProgresso"></div>
</div>

<p class="textoProgresso" id="textoProgresso">
Formulário 0% completo
</p>

<form id="form">

<div class="linha">
<input type="text" placeholder="Nome">
<input type="text" placeholder="Empresa">
</div>

<div class="linha">
<input type="email" placeholder="Email">
<input type="text" placeholder="Departamento">
</div>

<div class="linha">
<input type="text" placeholder="Telefone">

<select>
<option value="">Segmento</option>
<option>Tecnologia</option>
<option>Educação</option>
<option>Financeiro</option>
</select>
</div>

<h3>Serviços desejados</h3>

<div class="servicos">

<label class="servico">
<input type="checkbox">
<span>Desenvolvimento Web</span>
</label>

<label class="servico">
<input type="checkbox">
<span>Aplicações</span>
</label>

<label class="servico">
<input type="checkbox">
<span>Banco de Dados</span>
</label>

<label class="servico">
<input type="checkbox">
<span>APIs</span>
</label>

</div>

<textarea placeholder="Descrição do projeto"></textarea>

<button type="submit">
Enviar orçamento
</button>

</form>

</div>

<script src="../Js/formulario.js"></script>

</body>
</html>
