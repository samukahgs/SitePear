<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Formulário de Orçamento</title>

<link rel="stylesheet" href="../css/header.css">
<link rel="stylesheet" href="../css/formulario.css">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">

</head>

<body class="temaSite">

<header class="header">

<div class="container nav-container">

<div class="logo">
<img src="../imgs/LogoPEAR.png" alt="Logo">
</div>

<nav>
<ul class="menu">
<li><a href="quemsomos.html">Quem Somos</a></li>
<li><a href="servicos.html">Serviços</a></li>
<li><a href="contato.html">Contato</a></li>
</ul>
</nav>

<div class="language-selector">
<img src="../imgs/brasil.png" class="flag" alt="Português">
<span class="arrow">▾</span>
</div>

</div>

</header>


<main class="form-container">

<h1>Solicitar Orçamento</h1>

<form class="formulario">

<div class="linha">

<div class="campo">
<label>Nome</label>
<input type="text" placeholder="Seu nome">
</div>

<div class="campo">
<label>Empresa</label>
<input type="text" placeholder="Nome da empresa">
</div>

</div>


<div class="linha">

<div class="campo">
<label>Email</label>
<input type="email" placeholder="email@email.com" required>

</div>

<div class="campo">
<label>Departamento</label>
<input type="text" placeholder="Departamento">
</div>

</div>


<div class="linha">

<div class="campo">
<label>Telefone</label>
<input type="text" placeholder="(00) 00000-0000">
</div>

<div class="campo">
<label>Segmento</label>
<input type="text" placeholder="Área da empresa">
</div>

</div>


<div class="campo">
<label>Descrição do orçamento</label>
<textarea placeholder="Descreva seu projeto ou necessidade..."></textarea>
</div>

<button type="submit" class="botao-enviar">
Enviar orçamento
</button>

</form>

</main>

</body>
</html>
